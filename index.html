<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in</title>

    <link rel="stylesheet" href="assets/css/Styles.css">
</head>
<body class="cuerpo-Index">

    <div class="contenedor-Login">

        <!--Logo, collage, slogan-------------------------------------------------------------->
        <section class="izquierda-Login">

            <!--Logo-->
            <img src="#" alt="Eco Logo" class="logo">

            <!--Eslogan-->
            <h2>Let´s help<br>
                the planet<br>
                together,<br>one <span>Track</span> at a time
            </h2>

            <!--Collage-->
            <img src="#" alt="Collage" class="collage">

        </section>

        <!--Formulario-------------------------------------------------------------------------->
        <section class="derecha">

            <div class="login">

                <h2>Log in to EcoTrack</h2>


                <form action="components/Home.html" class="formulario-log">

                    <input type="text" placeholder="Email or Phone number" class="caja-texto">

                    <input type="password" placeholder="password" class="caja-texto">

                    <input type="submit" value="Log in" class="botoncito">
                </form>

                <a href="components/ReestorePassword.html">Forgotten password?</a>

                <button class="crear" onclick="BotonMover()">
                    Create new account
                </button>

                <p class="Eco">
                    ®EcoTrack
                </p>
            </div>
        </section>

    </div>
<script src="assets/Js/Script.js"></script>
</body>
</html>
